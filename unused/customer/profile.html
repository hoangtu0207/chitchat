    <!DOCTYPE html>
    <html lang="en">
    <head>

        <title>Trang cá nhân</title>

        <style>
            body {
                background-color: #f4f4f4; 
                font-family: 'Arial', sans-serif;
            }
        
            .profile-container {
                max-width: 1200px; 
                margin: 50px auto; 
                display: flex;
            }
            
            .menu {
                flex: 1; 
                background: #fff; 
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); 
                padding: 30px; 
                margin-right: 20px; 
            }
            
            .menu h4 {
                font-size: 1.8em; 
                color: #007bff;
                margin-bottom: 20px; 
                text-align: center; 
            }
            
            .menu a {
                display: flex; 
                align-items: center; 
                padding: 15px; 
                color: #333; 
                text-decoration: none; 
                border-radius: 5px; 
                margin-bottom: 15px; 
                transition: background 0.3s, color 0.3s; 
                font-size: 1.1em; 
                border: 1px solid transparent; 
            }
            
            .menu a:hover {
                background-color: #e9ecef; 
                color: #007bff; 
                border: 1px solid #007bff; 
            }
            
            .content {
                flex: 2; 
                background: #fff; 
                border-radius: 10px; 
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); 
                padding: 30px; 
                height: calc(100vh - 100px); 
                position: relative; 
            }
         
            .profile-header {
                text-align: center; 
                margin-bottom: 30px; 
            }

            .profile-header img {
                border-radius: 50%; 
                width: 180px; 
                height: 180px; 
                border: 3px solid #007bff;
            }

            .form-control {
                height: 45px; 
                padding: 10px; 
                font-size: 16px; 
            }

            .btn {
                height: 45px; 
                font-size: 16px;
            }

            
            .info {
                color: #213A58; 
            }
        
            .friend-request, .friend-suggestion {
                margin-bottom: 15px;
                padding: 15px; 
                border: 1px solid #e0e0e0; 
                border-radius: 5px;
                background: #f9f9f9;
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
            }           
            .friend-request button, .friend-suggestion button {
                margin-left: 10px; 
                width: 100px; 
            }
          
            .friend-group {
                display: flex; 
                justify-content: space-between; 
                margin: 10px 0; 
            }
            
            .friend-group img {
                width: 50px; 
                height: 50px; 
                border-radius: 50%; 
                margin-right: 10px; 
            }
  
            .notifications {
                width: 100%; 
                height: 100%; 
                padding: 20px; 
                box-sizing: border-box;
                background: #f1f1f1; 
                display: flex; 
                flex-direction: column; 
                gap: 15px;
                position: absolute;
                top: 0; 
                left: 0;
            }

            .notification-list {
                flex-grow: 1; 
                overflow-y: auto; 
            }

            .notification-item {
                padding: 15px; 
                border-radius: 5px; 
                margin-bottom: 10px; 
                background: #e9ecef; 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                transition: background 0.3s; 
                width: 100%; 
            }

            .notification-item:hover {
                background: #d4d4d4;
            }

            .notification-time {
                font-size: 0.9em; 
                color: #6c757d; 
            }

            .btn-center {
                display: flex; 
                justify-content: center; 
                margin-top: 20px; 
            }

            .btn-center button {
                padding: 10px 20px; 
                background-color: #007bff; 
                color: white; 
                border: none; 
                border-radius: 5px; 
                cursor: pointer; 
                transition: background-color 0.3s;
            }

            .btn-center button:hover {
                background-color: #0056b3; 
            }


            
            .change-password {
                width: 100%; 
                height: 100%; 
                padding: 20px; 
                box-sizing: border-box; 
                background: #f1f1f1; 
                display: flex; 
                flex-direction: column; 
                gap: 15px; 
                position: absolute; 
                top: 0; 
                left: 0; 
            }            
            .change-password h3 {
                margin: 0;
            }
            
            .groups-section {
                width: 100%; 
                height: 100%;
                padding: 20px; 
                box-sizing: border-box; 
                background: #f1f1f1; 
                display: flex; 
                flex-direction: column; 
                gap: 15px; 
                position: absolute; 
                top: 0; 
                left: 0; 
            }
                    
            .toggle-container {
                display: flex;
                padding: 15px;
                background-color: #f7f9fc;
                border-bottom: 1px solid #ccc;
            }
            
            .toggle {
                cursor: pointer;
                padding: 20px;
                background-color: #007bff;
                color: white;
                border-radius: 5px;
                margin-right: 10px;
                flex: 1;
                text-align: center;
                font-weight: bold;
                transition: background-color 0.3s;
            }
            
            .toggle:hover {
                background-color: #0056b3;
            }
            
            .group-list {
                display: block;
                flex-grow: 1;
                overflow-y: auto;
                padding: 30px;
            }
            
            .group-list h4 {
                margin: 0 0 20px;
                font-size: 28px;
                color: #333;
            }
            
            .group-item {
                padding: 20px;
                border-bottom: 1px solid #eee;
                display: flex;
                align-items: center;
            }
            
            .group-item img {
                border-radius: 50%;
                margin-right: 15px;
            }
            
            .message-list {
                width: 100%; 
                height: 100%; 
                padding: 20px; 
                box-sizing: border-box;
                background: #f9f9f9; 
                display: flex;
                flex-direction: column; 
                gap: 15px; 
                position: absolute; 
                top: 0; 
                left: 0; 
                overflow-y: auto;
                border-radius: 10px; 
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }
            
            .user {
                display: flex;
                align-items: center; 
                padding: 15px; 
                cursor: pointer; 
                transition: background-color 0.3s, transform 0.2s;
                background-color: white; 
                border-radius: 8px; 
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); 
            }
            
            .user:hover {
                background-color: #e9e9e9; 
                transform: scale(1.02); 
            }
            
            .avatar {
                width: 50px; 
                height: 50px;
                border-radius: 50%; 
                margin-right: 15px;
                border: 2px solid #007bff; 
            }
            
            .status {
                width: 12px;
                height: 12px; 
                border-radius: 50%; 
                background-color: green; 
                margin-right: 15px; 
                border: 2px solid white; 
            }
            

            footer {
                background-color: #CDFDC8; 
                color: black; 
                text-align: center; 
                padding: 5px;
                margin-top: auto; 
                font-size: 0.9em;
            }
            
        </style>
    </head>

                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profileImage').src = e.target.result;
                };
                if (file) {
                    reader.readAsDataURL(file);
                }
            }
